<div class="page">
  <ino-nav [links]="navLinks" ctaLabel="Request demo" (ctaClick)="onCta()">
    <a logo routerLink="/" class="ino-logo" aria-label="INOVIXUX — home">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <defs>
          <linearGradient id="inoNavGrad" x1="2" y1="16" x2="18" y2="3" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7C5CFC" />
            <stop offset="1" stop-color="#4F46E5" />
          </linearGradient>
        </defs>
        <path d="M3 3 L3 17 M8 3 L16 17 M16 3 L8 17" stroke="url(#inoNavGrad)" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="12" cy="10" r="1.9" fill="url(#inoNavGrad)" />
        <circle cx="3" cy="3" r="1.1" fill="url(#inoNavGrad)" opacity="0.5" />
        <circle cx="3" cy="17" r="1.1" fill="url(#inoNavGrad)" opacity="0.5" />
        <circle cx="8" cy="3" r="1.1" fill="url(#inoNavGrad)" opacity="0.45" />
        <circle cx="16" cy="3" r="1.1" fill="url(#inoNavGrad)" opacity="0.45" />
        <circle cx="8" cy="17" r="1.1" fill="url(#inoNavGrad)" opacity="0.45" />
        <circle cx="16" cy="17" r="1.1" fill="url(#inoNavGrad)" opacity="0.45" />
      </svg>
      <span>INOVIXUX</span>
    </a>
  </ino-nav>

  <router-outlet></router-outlet>

  <ino-footer [columns]="footerColumns">
    <span logo class="ino-logo ino-logo--footer">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <defs>
          <linearGradient id="inoFootGrad" x1="2" y1="16" x2="18" y2="3" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7C5CFC" />
            <stop offset="1" stop-color="#4F46E5" />
          </linearGradient>
        </defs>
        <path d="M3 3 L3 17 M8 3 L16 17 M16 3 L8 17" stroke="url(#inoFootGrad)" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="12" cy="10" r="1.9" fill="url(#inoFootGrad)" />
        <circle cx="3" cy="3" r="1.1" fill="url(#inoFootGrad)" opacity="0.5" />
        <circle cx="3" cy="17" r="1.1" fill="url(#inoFootGrad)" opacity="0.5" />
        <circle cx="8" cy="3" r="1.1" fill="url(#inoFootGrad)" opacity="0.45" />
        <circle cx="16" cy="3" r="1.1" fill="url(#inoFootGrad)" opacity="0.45" />
        <circle cx="8" cy="17" r="1.1" fill="url(#inoFootGrad)" opacity="0.45" />
        <circle cx="16" cy="17" r="1.1" fill="url(#inoFootGrad)" opacity="0.45" />
      </svg>
      <span>INOVIXUX</span>
      <p>KYB vendor underwriting, verified by a human, traced by the system.</p>
    </span>
  </ino-footer>

  <p class="subfoot">© 2026 INOVIXUX — Verified Line design system, running as real Angular (not a static mockup).</p>
</div>
