<div class="ino-field">
  <ino-label
    [for]="inputId"
    [size]="size"
    [required]="required"
    [disabled]="disabled"
    [invalid]="!!error"
    [readonly]="readonly"
  >{{ label }}</ino-label>

  <span class="ino-field__control-wrap">
    <input
      [id]="inputId"
      class="ino-field__control ino-password__control"
      [class.ino-field__control--error]="!!error"
      [type]="revealed ? 'text' : 'password'"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [readOnly]="readonly"
      [required]="required"
      [autocomplete]="autocomplete"
      autocapitalize="off"
      autocorrect="off"
      [attr.spellcheck]="false"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-describedby]="describedBy"
      (input)="onInput($event)"
      (keydown)="onKeyEvent($event)"
      (keyup)="onKeyEvent($event)"
      (blur)="onBlur()"
    />
    <button
      type="button"
      class="ino-password__reveal"
      [disabled]="disabled"
      [attr.aria-pressed]="revealed"
      [attr.aria-label]="revealed ? 'Hide password' : 'Show password'"
      (click)="toggleReveal()"
    >
      <svg *ngIf="!revealed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 5c-5.5 0-9.6 3.6-11 7 1.4 3.4 5.5 7 11 7s9.6-3.6 11-7c-1.4-3.4-5.5-7-11-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7.2a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4Z"/>
      </svg>
      <svg *ngIf="revealed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M3.3 2.3 1.9 3.7l3.4 3.4C3.1 8.6 1.5 10.6.5 12c2 4.4 6.5 8 11.5 8 2 0 3.9-.6 5.5-1.5l3.3 3.2 1.4-1.4L3.3 2.3ZM12 16.5c-.6 0-1.1-.1-1.6-.3l-1.5-1.5a4.5 4.5 0 0 1 4.5-6.9l1.5 1.5c.05.4.1.75.1 1.2a4.5 4.5 0 0 1-3 4Zm0-11c5 0 9.6 3.6 11 7a13.1 13.1 0 0 1-3.4 4.6l-1.5-1.5A11 11 0 0 0 20.9 12c-1.3-2.9-4.6-5.5-8.9-5.5-1.1 0-2.1.15-3 .45L7.4 5.4A12 12 0 0 1 12 5.5Z"/>
      </svg>
    </button>
  </span>

  <p *ngIf="capsLockOn" class="ino-password__capslock" role="status">Caps Lock is on</p>

  <div *ngIf="showStrengthMeter" [id]="meterId" class="ino-password__meter" aria-live="polite">
    <span class="ino-password__meter-track" aria-hidden="true">
      <span
        *ngFor="let seg of meterSegments"
        class="ino-password__meter-seg"
        [class.ino-password__meter-seg--filled]="seg < strengthScore"
        [attr.data-strength]="strengthScore"
      ></span>
    </span>
    <span class="ino-password__meter-label">{{ value ? strengthLabel : '' }}</span>
  </div>

  <div *ngIf="policyRules.length" [id]="policyId" class="ino-password__policy" role="group" aria-label="Password requirements">
    <p *ngFor="let rule of policyRules" class="ino-password__policy-item" [class.ino-password__policy-item--met]="isRuleMet(rule)">
      <svg class="ino-password__policy-check" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M6.3 11.3 3.5 8.5l1.4-1.4 1.4 1.4 4.8-4.8 1.4 1.4Z"/>
      </svg>
      {{ rule.label }}
    </p>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-field__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-field__error" role="alert">{{ error }}</p>
</div>
