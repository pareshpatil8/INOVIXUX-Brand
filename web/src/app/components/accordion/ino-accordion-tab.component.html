<ng-container [ngSwitch]="headingTag">
  <h1 *ngSwitchCase="'h1'" class="ino-accordion-tab__heading">
    <button
      #headerButton
      type="button"
      class="ino-accordion-tab__header"
      [class.ino-accordion-tab__header--icon-end]="iconPosition === 'end'"
      [id]="headerId"
      [disabled]="isDisabled"
      [attr.aria-expanded]="expanded"
      [attr.aria-controls]="contentId"
      [attr.tabindex]="accordion && accordion.getTabIndex(this) === 0 ? 0 : -1"
      (click)="toggle()"
      (keydown)="onKeyDown($event)"
    >
      <span class="ino-accordion-tab__chevron" [class.ino-accordion-tab__chevron--expanded]="expanded" aria-hidden="true">▸</span>
      <span class="ino-accordion-tab__header-text">{{ header }}</span>
    </button>
  </h1>
