<div class="ino-tabs__strip">
  <button
    *ngIf="scrollable && hasOverflow && orientation === 'horizontal'"
    type="button"
    class="ino-tabs__scroll ino-tabs__scroll--prev"
    aria-label="Scroll tabs backward"
    (click)="scrollBy(-1)"
  >‹</button>

  <div
    #track
    class="ino-tabs__track"
    role="tablist"
    [attr.aria-orientation]="orientation"
    [attr.data-readonly]="readonly || null"
  >
    <button
      *ngFor="let panel of panels; let i = index"
      role="tab"
      type="button"
      class="ino-tabs__tab"
      [id]="panel.tabButtonId"
      [attr.aria-controls]="panel.panelId"
      [attr.aria-selected]="i === currentActiveIndex"
      [attr.aria-busy]="panel.loading || null"
      [attr.aria-invalid]="panel.invalid || null"
      [attr.aria-disabled]="readonly && i !== currentActiveIndex ? 'true' : null"
      [attr.tabindex]="i === currentActiveIndex ? 0 : -1"
      [disabled]="panel.disabled"
      [class.ino-tabs__tab--active]="i === currentActiveIndex"
      [class.ino-tabs__tab--invalid]="panel.invalid"
      (click)="selectTab(i)"
      (keydown)="onKeydown($event, i)"
    >
      <span *ngIf="panel.loading" class="ino-tabs__tab-spinner" aria-hidden="true"></span>
      <span *ngIf="panel.invalid && !panel.loading" class="ino-tabs__tab-invalid-dot" aria-hidden="true"></span>
      <span class="ino-tabs__tab-label">{{ panel.label }}</span>
      <!-- Presentational, never a nested control: interactive content inside a <button> is invalid
           HTML and unreachable for keyboard/AT users. The keyboard path to the same action is the
           APG "tabs with close buttons" Delete/Backspace key handled on the tab itself, and the
           accessible name carries the affordance ("Reports, closable") — SPEC.md §7. -->
      <span
        *ngIf="panel.closable && !readonly"
        class="ino-tabs__tab-close"
        aria-hidden="true"
        (click)="closeTab($event, i)"
      >✕</span>
      <span *ngIf="panel.closable && !readonly" class="ino-tabs__sr-only">
        , closable — press Delete to close
      </span>
    </button>
  </div>

  <button
    *ngIf="scrollable && hasOverflow && orientation === 'horizontal'"
    type="button"
    class="ino-tabs__scroll ino-tabs__scroll--next"
    aria-label="Scroll tabs forward"
    (click)="scrollBy(1)"
  >›</button>
</div>

<div class="ino-tabs__panels">
  <ng-content></ng-content>
</div>
