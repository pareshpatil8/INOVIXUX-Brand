<figure class="ino-image__figure">
  <ng-container *ngIf="previewable && src && !imageFailed(); else staticFrame">
    <button
      type="button"
      class="ino-image__trigger"
      (click)="openLightbox()"
      [attr.aria-label]="'Open full-size preview: ' + (alt || 'image')"
    >
      <ng-container *ngTemplateOutlet="frame"></ng-container>
    </button>
  </ng-container>
  <ng-template #staticFrame>
    <ng-container *ngTemplateOutlet="frame"></ng-container>
  </ng-template>

  <ng-template #frame>
    <div
      class="ino-image__frame"
      [class.ino-image__frame--sized]="width || height"
      [style.inline-size]="width || null"
      [style.block-size]="height || null"
    >
      <ino-skeleton
        *ngIf="src && !imageLoaded() && !imageFailed()"
        class="ino-image__skeleton"
        shape="rectangle"
        [attr.aria-hidden]="true"
      ></ino-skeleton>

      <img
        *ngIf="src && !imageFailed()"
        class="ino-image__img"
        [class.ino-image__img--hidden]="!imageLoaded()"
        [src]="src"
        [alt]="alt"
        [loading]="loading"
        [style.object-fit]="fit"
        (load)="onLoad()"
        (error)="onError()"
      />

      <div
        *ngIf="imageFailed() || !src"
        class="ino-image__fallback"
        role="img"
        [attr.aria-label]="alt || 'Image unavailable'"
      >
        <span class="ino-image__fallback-slot"><ng-content select="[fallback]"></ng-content></span>
        <svg
          class="ino-image__fallback-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </div>
    </div>
  </ng-template>

  <figcaption class="ino-image__caption"><ng-content select="[caption]"></ng-content></figcaption>
</figure>

<div *ngIf="lightboxOpen()" class="ino-image__lightbox" (keydown)="onLightboxKeydown($event)">
  <div class="ino-image__scrim" (click)="closeLightbox()"></div>

  <div
    inoFocusTrap
    class="ino-image__lightbox-panel"
    [class.ino-image__lightbox-panel--zoomed]="zoomed()"
    role="dialog"
    aria-modal="true"
    [id]="dialogId"
    [attr.aria-label]="alt || 'Image preview'"
    tabindex="-1"
  >
    <div class="ino-image__lightbox-viewport">
      <img
        class="ino-image__lightbox-img"
        [src]="src"
        [alt]="alt"
        [style.transform]="lightboxTransform()"
      />
    </div>

    <div class="ino-image__lightbox-controls">
      <button type="button" (click)="zoomOut()" [disabled]="!canZoomOut()" aria-label="Zoom out">−</button>
      <button type="button" (click)="zoomIn()" [disabled]="!canZoomIn()" aria-label="Zoom in">+</button>
      <button type="button" (click)="rotateCounterClockwise()" aria-label="Rotate left">⟲</button>
      <button type="button" (click)="rotateClockwise()" aria-label="Rotate right">⟳</button>
      <button type="button" (click)="resetView()" aria-label="Reset zoom and rotation">Reset</button>
      <button type="button" class="ino-image__lightbox-close" (click)="closeLightbox()" aria-label="Close preview">✕</button>
    </div>
  </div>
</div>
