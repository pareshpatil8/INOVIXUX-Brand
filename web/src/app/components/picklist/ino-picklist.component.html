<div class="ino-field" [class.ino-field--disabled]="disabled">
  <div class="ino-picklist__body">
    <div class="ino-picklist__pane">
      <ino-label [for]="sourceListId" [size]="size === 'compact' ? 'sm' : 'default'" [required]="required" [disabled]="disabled" [readonly]="readonly" [invalid]="!!error">{{ sourceLabel }}</ino-label>
      <ul
        [id]="sourceListId"
        class="ino-picklist__list"
        role="listbox"
        aria-multiselectable="true"
        [attr.aria-label]="sourceLabel || null"
        [attr.aria-disabled]="disabled ? true : null"
        [attr.aria-busy]="loading || null"
      >
        <li
          *ngFor="let option of source; let i = index"
          [id]="optionId('source', i)"
          role="option"
          class="ino-picklist__option"
          [class.ino-picklist__option--selected]="isSelected('source', option)"
          [class.ino-picklist__option--disabled]="option.disabled"
          [class.ino-picklist__option--moved-flash]="isFlashed('source', option)"
          [attr.tabindex]="option.disabled ? null : (isActiveTabStop('source', i) ? 0 : -1)"
          [attr.aria-selected]="isSelected('source', option)"
          [attr.aria-disabled]="option.disabled || null"
          (click)="activateOption('source', i, option)"
          (keydown)="onOptionKeydown($event, 'source', i, option)"
        >
          <input type="checkbox" class="ino-picklist__checkbox" tabindex="-1" aria-hidden="true" [checked]="isSelected('source', option)" [disabled]="option.disabled" />
          {{ option.label }}
        </li>
        <li *ngIf="!source.length" class="ino-picklist__empty" role="presentation">No items.</li>
      </ul>
    </div>

    <div class="ino-picklist__controls">
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMoveToTarget" (click)="moveToTarget()">To {{ targetLabel }} →</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMoveAllToTarget" (click)="moveAllToTarget()">All →</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMoveAllToSource" (click)="moveAllToSource()">← All</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMoveToSource" (click)="moveToSource()">← To {{ sourceLabel }}</button>
    </div>

    <div class="ino-picklist__pane">
      <ino-label [for]="targetListId" [size]="size === 'compact' ? 'sm' : 'default'" [required]="required" [disabled]="disabled" [readonly]="readonly" [invalid]="!!error">{{ targetLabel }}</ino-label>
      <ul
        [id]="targetListId"
        class="ino-picklist__list"
        role="listbox"
        aria-multiselectable="true"
        [attr.aria-label]="targetLabel || null"
        [attr.aria-disabled]="disabled ? true : null"
        [attr.aria-busy]="loading || null"
        [attr.aria-describedby]="error ? errorId : (hint ? hintId : null)"
      >
        <li
          *ngFor="let option of target; let i = index"
          [id]="optionId('target', i)"
          role="option"
          class="ino-picklist__option"
          [class.ino-picklist__option--selected]="isSelected('target', option)"
          [class.ino-picklist__option--disabled]="option.disabled"
          [class.ino-picklist__option--moved-flash]="isFlashed('target', option)"
          [attr.tabindex]="option.disabled ? null : (isActiveTabStop('target', i) ? 0 : -1)"
          [attr.aria-selected]="isSelected('target', option)"
          [attr.aria-disabled]="option.disabled || null"
          (click)="activateOption('target', i, option)"
          (keydown)="onOptionKeydown($event, 'target', i, option)"
        >
          <input type="checkbox" class="ino-picklist__checkbox" tabindex="-1" aria-hidden="true" [checked]="isSelected('target', option)" [disabled]="option.disabled" />
          {{ option.label }}
        </li>
        <li *ngIf="!target.length" class="ino-picklist__empty" role="presentation">No items.</li>
      </ul>
    </div>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-picklist__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-picklist__error" role="alert">{{ error }}</p>
</div>
