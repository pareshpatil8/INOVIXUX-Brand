<div class="ino-field" [class.ino-field--disabled]="disabled">
  <ino-label [for]="treeSelectId" [size]="size" [required]="required" [disabled]="disabled" [readonly]="readonly" [invalid]="!!error">{{ label }}</ino-label>

  <div class="ino-field__control-wrap">
    <button
      #trigger
      type="button"
      [id]="treeSelectId"
      class="ino-field__control ino-field__control--trigger"
      [class.ino-field__control--error]="!!error"
      [class.ino-field__control--placeholder]="!selectedNodes.length"
      [disabled]="disabled"
      [attr.aria-disabled]="readonly ? true : null"
      [attr.aria-busy]="loading || null"
      role="combobox"
      aria-haspopup="tree"
      [attr.aria-controls]="treeId"
      [attr.aria-expanded]="open"
      [attr.aria-activedescendant]="filter ? null : activeRowId()"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-describedby]="error ? errorId : (hint ? hintId : null)"
      (click)="toggle()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span class="ino-field__value">{{ triggerLabel }}</span>
    </button>

    <span *ngIf="loading" class="ino-field__spinner" aria-hidden="true"></span>
    <span class="ino-field__chevron" aria-hidden="true">▾</span>

    <div *ngIf="open" class="ino-field__panel">
      <input
        *ngIf="filter"
        #filterInput
        type="text"
        class="ino-field__filter"
        [attr.aria-label]="filterLabel"
        [placeholder]="filterPlaceholder"
        [value]="filterText"
        [attr.aria-controls]="treeId"
        [attr.aria-activedescendant]="activeRowId()"
        (input)="onFilterInput($event)"
        (keydown)="onFilterKeydown($event)"
      />

      <ng-container *ngIf="rows.length; else emptyState">
        <ul
          [id]="treeId"
          class="ino-field__tree"
          role="tree"
          [attr.aria-label]="label || placeholder"
          [attr.aria-multiselectable]="selectionMode !== 'single' ? true : null"
        >
          <li
            *ngFor="let row of rows"
            [id]="rowId(row.index)"
            role="treeitem"
            class="ino-field__option ino-field__treeitem"
            [style.padding-inline-start]="'calc(var(--ino-space-4) + ' + row.level + ' * var(--ino-treeselect-indent))'"
            [class.ino-field__option--active]="isActive(row.index)"
            [class.ino-field__option--selected]="isSelected(row.node)"
            [class.ino-field__option--disabled]="row.node.disabled"
            [attr.aria-level]="row.level + 1"
            [attr.aria-expanded]="row.hasVisibleChildren ? isExpanded(row.node) : null"
            [attr.aria-selected]="selectionMode !== 'checkbox' ? isSelected(row.node) : null"
            [attr.aria-checked]="selectionMode === 'checkbox' ? (isPartial(row.node) ? 'mixed' : isSelected(row.node)) : null"
            [attr.aria-disabled]="row.node.disabled || null"
            (mouseenter)="activeIndex = row.index"
            (click)="activateNode(row.node)"
          >
            <button
              *ngIf="row.hasVisibleChildren"
              type="button"
              class="ino-field__tree-toggle"
              tabindex="-1"
              [disabled]="row.node.loading"
              aria-hidden="true"
              (click)="toggleExpand(row.node, $event)"
            >
              <span *ngIf="row.node.loading" class="ino-field__tree-spinner" aria-hidden="true"></span>
              <span
                *ngIf="!row.node.loading"
                class="ino-field__tree-chevron"
                [class.ino-field__tree-chevron--expanded]="isExpanded(row.node)"
                aria-hidden="true"
              >▸</span>
            </button>
            <span *ngIf="!row.hasVisibleChildren" class="ino-field__tree-spacer" aria-hidden="true"></span>

            <input
              *ngIf="selectionMode === 'checkbox'"
              type="checkbox"
              class="ino-field__checkbox"
              tabindex="-1"
              aria-hidden="true"
              [checked]="isSelected(row.node)"
              [indeterminate]="isPartial(row.node)"
              [disabled]="row.node.disabled"
            />

            <span class="ino-field__tree-label">{{ row.node.label }}</span>
          </li>
        </ul>
      </ng-container>

      <ng-template #emptyState>
        <p class="ino-field__empty">{{ emptyMessage }}</p>
      </ng-template>
    </div>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-field__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-field__error" role="alert">{{ error }}</p>
</div>
