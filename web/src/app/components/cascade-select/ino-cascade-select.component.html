<div class="ino-field" [class.ino-field--disabled]="disabled">
  <ino-label [for]="cascadeId" [size]="size" [required]="required" [disabled]="disabled" [readonly]="readonly" [invalid]="!!error">{{ label }}</ino-label>

  <div class="ino-field__control-wrap">
    <button
      #trigger
      type="button"
      [id]="cascadeId"
      class="ino-field__control ino-field__control--trigger"
      [class.ino-field__control--error]="!!error"
      [class.ino-field__control--placeholder]="!selectedLabel"
      [disabled]="disabled"
      [attr.aria-disabled]="readonly ? true : null"
      [attr.aria-busy]="loading || null"
      role="combobox"
      aria-haspopup="listbox"
      [attr.aria-controls]="listboxId"
      [attr.aria-expanded]="open"
      [attr.aria-activedescendant]="activeOptionId()"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-describedby]="error ? errorId : (hint ? hintId : null)"
      (click)="toggle()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span class="ino-field__value">{{ selectedLabel || placeholder }}</span>
    </button>

    <span *ngIf="loading" class="ino-field__spinner" aria-hidden="true"></span>
    <span class="ino-field__chevron" aria-hidden="true">▾</span>

    <div *ngIf="open" class="ino-field__panel">
      <!-- Breadcrumb of the drill-down path (doc 26 §5 structure requirement) — only rendered
           below the root level, same rationale ino-listbox's filter-box visibility rule uses:
           don't add chrome for a state that isn't true yet. -->
      <nav *ngIf="path.length" class="ino-field__breadcrumb" [attr.aria-label]="'Selected path'">
        <button type="button" tabindex="-1" class="ino-field__breadcrumb-back" (click)="goBack()" [attr.aria-label]="backLabel">‹</button>
        <ol class="ino-field__breadcrumb-trail">
          <li *ngFor="let ancestor of path; let i = index">
            <button
              type="button"
              tabindex="-1"
              class="ino-field__breadcrumb-item"
              [attr.aria-current]="i === path.length - 1 ? 'true' : null"
              (click)="goBack(i + 1)"
            >{{ ancestor.label }}</button>
          </li>
        </ol>
      </nav>

      <ng-container *ngIf="currentRows.length; else emptyState">
        <ul [id]="listboxId" class="ino-field__listbox" role="listbox" [attr.aria-label]="label || placeholder">
          <li
            *ngFor="let row of currentRows"
            [id]="optionId(row.index)"
            role="option"
            class="ino-field__option"
            [class.ino-field__option--active]="isActive(row.index)"
            [class.ino-field__option--selected]="isSelected(row.option)"
            [class.ino-field__option--disabled]="row.option.disabled"
            [class.ino-field__option--parent]="hasChildren(row.option)"
            [attr.aria-selected]="isSelected(row.option)"
            [attr.aria-disabled]="row.option.disabled || null"
            [attr.aria-haspopup]="hasChildren(row.option) ? 'listbox' : null"
            (mouseenter)="!row.option.disabled && (activeIndex = row.index)"
            (click)="activateRow(row)"
          >
            <span class="ino-field__option-label">
              <ng-container *ngIf="optionTemplate; else plainOption" [ngTemplateOutlet]="optionTemplate" [ngTemplateOutletContext]="{ $implicit: row.option }"></ng-container>
              <ng-template #plainOption>{{ row.option.label }}</ng-template>
            </span>
            <span *ngIf="hasChildren(row.option)" class="ino-field__option-caret" aria-hidden="true">›</span>
          </li>
        </ul>
      </ng-container>

      <ng-template #emptyState>
        <p class="ino-field__empty">No options found.</p>
      </ng-template>
    </div>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-field__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-field__error" role="alert">{{ error }}</p>
</div>
