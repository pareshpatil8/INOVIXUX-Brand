<div class="ino-field" [class.ino-field--disabled]="disabled">
  <ino-label [for]="listId" [size]="size === 'compact' ? 'sm' : 'default'" [required]="required" [disabled]="disabled" [readonly]="readonly" [invalid]="!!error">{{ label }}</ino-label>

  <div class="ino-orderlist__body">
    <ul
      [id]="listId"
      class="ino-orderlist__list"
      role="listbox"
      aria-multiselectable="true"
      [attr.aria-label]="label || null"
      [attr.aria-disabled]="disabled ? true : null"
      [attr.aria-busy]="loading || null"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-describedby]="error ? errorId : (hint ? hintId : null)"
    >
      <li
        *ngFor="let option of options; let i = index"
        [id]="optionId(i)"
        role="option"
        class="ino-orderlist__option"
        [class.ino-orderlist__option--selected]="isSelected(option)"
        [class.ino-orderlist__option--disabled]="option.disabled"
        [class.ino-orderlist__option--moved-flash]="isFlashed(option)"
        [attr.tabindex]="option.disabled ? null : (isActiveTabStop(i) ? 0 : -1)"
        [attr.aria-selected]="isSelected(option)"
        [attr.aria-disabled]="option.disabled || null"
        (click)="activateOption(i, option)"
        (keydown)="onOptionKeydown($event, i, option)"
      >
        <input type="checkbox" class="ino-orderlist__checkbox" tabindex="-1" aria-hidden="true" [checked]="isSelected(option)" [disabled]="option.disabled" />
        {{ option.label }}
      </li>
      <li *ngIf="!options.length" class="ino-orderlist__empty" role="presentation">No items.</li>
    </ul>

    <div class="ino-orderlist__controls">
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMove" (click)="moveToTop()">⤒ Top</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMove" (click)="moveUp()">↑ Up</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMove" (click)="moveDown()">↓ Down</button>
      <button type="button" ino-button variant="secondary" size="sm" [disabled]="!canMove" (click)="moveToBottom()">⤓ Bottom</button>
    </div>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-orderlist__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-orderlist__error" role="alert">{{ error }}</p>
</div>
