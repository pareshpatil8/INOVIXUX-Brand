<img
  *ngIf="showImage"
  class="ino-avatar__image"
  [src]="image"
  [alt]="decorative ? '' : alt"
  (error)="onImageError()"
/>
<span class="ino-avatar__initials" *ngIf="showInitials" aria-hidden="true">{{ initials }}</span>
<span class="ino-avatar__icon" *ngIf="!showImage && !showInitials">
  <ng-content select="[icon]"></ng-content>
</span>
<span class="ino-avatar__fallback-icon" *ngIf="!showImage && !showInitials" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </svg>
</span>
