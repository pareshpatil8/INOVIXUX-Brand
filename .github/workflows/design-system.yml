name: Design system

# The design-system gate (INO-118, extended by INO-185, INO-121). Four checks that ask
# different questions:
#
#   parity      — do web, React Native and Flutter agree about what the tokens ARE?
#   adherence   — does the component source actually USE them?
#   citations   — do the files a component's SPEC.md cites actually EXIST here?
#   email-tokens — do the transactional email templates still match a fresh
#                  regeneration from tokens.css (INO-121), or did someone hand-edit
#                  the generated HTML and make email a third source of truth?
#
# Parity passes with flying colours on a codebase where every component hardcodes
# #7C5CFC, because the token files still agree with each other. Adherence is the
# gate that catches that. Citations catches the third failure that neither sees: a
# decision record justified by a sibling that is still on someone else's branch.
#
# Deliberately NOT part of deploy-pages.yml: that workflow only runs on push to
# main, so it can only tell you about drift you have already merged. This one runs
# on the pull request, which is the only place the answer is still cheap to act on.
#
# None of those four asks the fifth question: DOES IT BUILD. A component can be
# token-perfect, cite correctly, regenerate its emails byte-for-byte, and not
# compile. Until INO-262 no workflow on any branch ran ng build, tsc or flutter
# analyze — the "Angular / RN / Flutter green" rows in every SPEC.md were author
# hand-run claims, not CI facts. The compile-* jobs below are the CI facts.

on:
  push:
    # ino-31-design-system-parity is the Wave 1/2 integration branch: nine-plus
    # component branches merge into it and only then does it PR into main. Gating
    # it on push is the only way the COMBINED post-merge state gets checked —
    # per-PR green says each branch was fine against the base as it was, and
    # GitHub does not re-run a PR's checks when the base moves underneath it.
    # (INO-262: PRs #8 and #12 both displayed green against a base 34 commits stale.)
    branches: [main, ino-31-design-system-parity]
  pull_request:
  workflow_dispatch: {}

# A superseded push has nothing useful left to say — cancel it and answer for the tip.
concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tokens — parity and adherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`. Both scripts are dependency-free ESM over node: builtins, which
      # is what makes this job ~15s instead of ~3min — and is the reason the gate can
      # run on every PR without anyone wanting to switch it off. Please keep it that
      # way: a design-system lint that needs three toolchains installed (Angular SCSS,
      # React Native TSX, Flutter Dart) is a design-system lint that gets disabled.
      - name: Token parity — web <-> React Native <-> Flutter
        run: node scripts/check-theme-parity.mjs

      # Fails on a raw #7C5CFC, an off-scale 13px, a non-token radius/shadow/duration,
      # a primitive-token reference, or a hardcoded icon colour. Pre-existing violations
      # are waived in scripts/ds-adherence-waivers.json, and each waiver names the issue
      # that deletes it — so this blocks NEW drift without blocking on a cleanup.
      #
      # If this step fails on your PR: fix the violation. The message names the nearest
      # on-scale token. Add a waiver only when the fix genuinely needs a token decision,
      # and say so on the owning issue — an unused waiver fails this build too, so the
      # file cannot quietly become a parking lot.
      - name: Design-system adherence
        run: node scripts/check-ds-adherence.mjs

      # Fails on a SPEC.md citation that points at a file which does not exist here
      # (standards doc §5b). No --ref needed: on a pull_request, actions/checkout
      # gives us the MERGE commit, so the working tree already is the merge result —
      # which is exactly the state the citation has to resolve against.
      #
      # If this step fails on your PR: the sibling you cited is still on someone
      # else's branch. Either cite a file that is on the base, or keep the sentence
      # and mark it "(pending INO-nnn)" in the same paragraph / list item / table row.
      # Do not delete the reasoning — a declared forward reference is the point.
      - name: SPEC.md citations resolve
        run: node scripts/check-spec-citations.mjs

      # Regenerates docs/brand/07-collateral/email/templates/*.html from tokens.css in
      # place and diffs against what's committed. Fails if the generated HTML was
      # hand-edited, or if tokens.css changed without regenerating the emails.
      #
      # If this step fails on your PR: run `node scripts/gen-email-templates.mjs` and
      # commit the result instead of editing the HTML directly.
      - name: Email templates match tokens.css
        run: node scripts/check-email-tokens.mjs

  # ---------------------------------------------------------------------------
  # The compile gate (INO-262). Three SEPARATE jobs, deliberately:
  #
  #  * separate from `check` — `check` installs nothing and finishes in ~15s, and
  #    the header above asks that this be preserved. Adding `npm ci` to it would
  #    turn the cheap gate into a 3-minute one and someone would switch it off.
  #  * separate from EACH OTHER — they run in parallel (wall-clock is the slowest
  #    leg, not the sum), each installs only its own toolchain, and a red Flutter
  #    leg cannot hide a red Angular one behind a single "compile failed".
  #
  # No `paths:` filters on this workflow, and please don't add any. A required
  # check that is skipped by a path filter is reported as *pending*, not passing,
  # and blocks the PR forever. Caching makes the docs-only case cheap enough.
  #
  # Status as of INO-262 (verified locally against fcdf1ad, the integration branch
  # tip): all four toolchains compile clean. Nothing was broken — the gate was just
  # never watching. So these jobs land BLOCKING, not advisory: the issue proposed
  # advisory-first because nobody knew what was broken, and now we do. Making the
  # jobs required *in branch protection* is a separate repo-admin change and stays
  # out of scope here; what this file controls is that a compile failure fails the
  # workflow instead of being invisible.

  compile-web:
    name: Compile — Angular (web + capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # web/ and mobile/capacitor/app/ are npm workspaces sharing one root install
      # so their @angular/* deps can't drift apart (INO-99) — install from the repo
      # root, not from web/. One `npm ci` covers both builds below.
      - name: Install dependencies
        run: npm ci

      # --configuration production, not development: AOT template type-checking and
      # the SCSS budgets only run in the production configuration, and AOT is where
      # a bad template binding actually becomes an error rather than a runtime blank.
      - name: ng build — web
        working-directory: web
        run: npx ng build --configuration production

      # The capacitor app is the second Angular consumer of the same token layer.
      # It is not in INO-262's stated scope, but it shares the root install, adds
      # ~40s, and is the other place an Angular-side token change can break.
      - name: ng build — capacitor app
        working-directory: mobile/capacitor/app
        run: npx ng build --configuration production

  compile-react-native:
    name: Compile — React Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json

      # Separate lockfile and node_modules from the root workspace — the RN track is
      # deliberately not an npm workspace member (Expo's resolver and Angular's do
      # not co-exist happily in one hoisted tree).
      - name: Install dependencies
        working-directory: mobile/react-native
        run: npm ci

      # tsc --noEmit, not `expo export`: the question here is "do the types hold",
      # and a Metro bundle is a much slower way to ask it. The web export still runs
      # in deploy-pages.yml on main, which is where a bundler-only failure would show.
      - name: tsc --noEmit
        working-directory: mobile/react-native
        run: npm run typecheck

  compile-flutter:
    name: Compile — Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party action, so pinned to a commit SHA rather than a moving tag —
      # a tag is repointable by its owner and this job runs on every PR.
      # 1a44944 is subosito/flutter-action v2.23.0 (== the v2 tag as of 2026-09-23).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile/flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile/flutter
        run: flutter analyze --no-pub
