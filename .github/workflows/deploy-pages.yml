name: Deploy design-system app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "assets/brand/**"
      - "docs/brand/mockups/**"
      - "mobile/react-native/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # web/ and mobile/capacitor/app/ are npm workspaces sharing one root
      # install so their @angular/* deps can't drift apart (INO-99) — install
      # from the repo root, not from web/.
      - name: Install dependencies
        run: npm ci

      - name: Build (production, base href for project pages)
        working-directory: web
        run: npx ng build --configuration production --base-href /INOVIXUX-Brand/

      - name: Copy brand asset library into build output
        run: |
          mkdir -p web/dist/web/browser/brand-assets
          cp -R assets/brand/. web/dist/web/browser/brand-assets/

      - name: Copy logo/brand concept mockups into build output
        run: |
          mkdir -p web/dist/web/browser/brand/mockups
          cp -R docs/brand/mockups/. web/dist/web/browser/brand/mockups/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/react-native/package-lock.json

      - name: Install React Native track dependencies
        working-directory: mobile/react-native
        run: npm ci

      - name: Export React Native track to static web (INO-107)
        working-directory: mobile/react-native
        run: npm run export:web

      - name: Copy React Native mobile preview into build output
        run: |
          mkdir -p web/dist/web/browser/mobile-preview/react-native
          cp -R mobile/react-native/dist-web/. web/dist/web/browser/mobile-preview/react-native/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
