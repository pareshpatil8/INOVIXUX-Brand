name: Deploy design-system app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/brand/**"
      - "docs/brand/mockups/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (production, base href for project pages)
        working-directory: web
        run: npx ng build --configuration production --base-href /INOVIXUX-Brand/

      - name: Copy brand asset library into build output
        run: |
          mkdir -p web/dist/web/browser/brand-assets
          cp -R assets/brand/. web/dist/web/browser/brand-assets/

      - name: Copy logo/brand concept mockups into build output
        run: |
          mkdir -p web/dist/web/browser/brand/mockups
          cp -R docs/brand/mockups/. web/dist/web/browser/brand/mockups/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
