<!doctype html>
<html lang="en" data-density="fluid">
<head>
  <meta charset="utf-8">
  <title>INOVIXUX</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="INOVIXUX mobile app — Capacitor track.">
  <!--
    Pre-paint theme selection, duplicated (not imported) from web/src/index.html — this is a
    12-line inline script, not a component, so there's nothing to reuse-by-reference the way the
    Angular components/ThemeService below are; keeping the two copies identical is a one-line diff
    to check if tokens.css's theme contract ever changes. See docs/brand/13-mobile-app-patterns.md
    §3 and mobile/capacitor/README.md.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('ino-theme');
        var wantsLight = stored ? stored === 'light'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (wantsLight) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        // Storage/matchMedia unavailable — fall through to the dark default.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
