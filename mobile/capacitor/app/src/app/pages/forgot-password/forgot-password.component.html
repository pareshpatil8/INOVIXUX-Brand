<div class="forgot-password">
  <button type="button" class="forgot-password__back" (click)="backToSignIn()" aria-label="Back to sign in">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <h1 class="forgot-password__headline">Reset password</h1>

  <ino-card variant="default" padding="lg">
    <ng-container *ngIf="!sent; else sentTpl">
      <p class="forgot-password__copy">
        Enter the email on your account and we'll send a reset link.
      </p>
      <form class="forgot-password__form" (ngSubmit)="onSubmit()">
        <ino-input
          label="Email"
          type="email"
          placeholder="you@company.com"
          [value]="email"
          (valueChange)="email = $event"
          required>
        </ino-input>
        <button ino-button type="submit" variant="primary">Send reset link</button>
      </form>
    </ng-container>

    <ng-template #sentTpl>
      <p class="forgot-password__copy">Check your inbox for a reset link.</p>
      <button ino-button type="button" variant="secondary" (click)="backToSignIn()">
        Back to sign in
      </button>
    </ng-template>
  </ino-card>
</div>
