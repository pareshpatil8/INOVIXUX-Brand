<div class="ino-field" [class.ino-field--disabled]="disabled">
  <label [for]="selectId" class="ino-field__label">
    {{ label }}<span *ngIf="required" class="ino-field__required" aria-hidden="true"> *</span>
  </label>

  <div class="ino-field__select-wrap">
    <select
      [id]="selectId"
      class="ino-field__control ino-field__control--select"
      [class.ino-field__control--error]="!!error"
      [disabled]="disabled"
      [required]="required"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-describedby]="error ? errorId : (hint ? hintId : null)"
      (change)="onChange($event)"
    >
      <option *ngIf="placeholder" value="" disabled [selected]="!value">{{ placeholder }}</option>
      <option *ngFor="let option of options" [value]="option.value" [selected]="option.value === value">
        {{ option.label }}
      </option>
    </select>
    <span class="ino-field__chevron" aria-hidden="true">▾</span>
  </div>

  <p *ngIf="hint && !error" [id]="hintId" class="ino-field__hint">{{ hint }}</p>
  <p *ngIf="error" [id]="errorId" class="ino-field__error" role="alert">{{ error }}</p>
</div>
