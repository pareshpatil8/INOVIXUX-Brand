<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family:'Geist', 'Noto Sans Devanagari', system-ui, -apple-system, Arial, Helvetica, sans-serif; font-size:13px; line-height:1.5; color:#14141A;">
  <tr>
    <td style="padding:0 16px 0 0; border-right:2px solid #7C5CFC;">
      <span style="font-weight:700; font-size:15px; letter-spacing:0.02em;">{{fullName}}</span><br />
      <span style="color:#55555C;">{{jobTitle}}</span>
    </td>
    <td style="padding:0 0 0 16px;">
      <span style="font-weight:700; letter-spacing:0.02em;">INOVIXUX</span><br />
      <a href="mailto:{{email}}" style="color:#4F46E5; text-decoration:none;">{{email}}</a>
      {{#if phone}}&nbsp;&middot;&nbsp;<span style="color:#55555C;">{{phone}}</span>{{/if}}<br />
      <a href="{{websiteUrl}}" style="color:#4F46E5; text-decoration:none;">{{websiteDisplay}}</a>
    </td>
  </tr>
</table>
